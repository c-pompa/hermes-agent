# Runtime-bundle manifest (fork-only file — never push to GitHub remotes).
# Consumed by the compose-bundle CI job via the fork-upgrader plugin's
# scripts/bundle_compose.py. Format: see plugins/fork-upgrader/README.md
# in the plugin repo ("Runtime bundles").
plugins:
  - name: fork-upgrader
    repo: https://gitlab.cpompa.com/hermes-plugins/fork-upgrader.git
    ref: main                # branch, tag, or sha — the resolved sha is recorded
    paths:
      - plugins/fork-upgrader
      - desktop-plugins/fork-upgrader
settings_templates: settings/templates
