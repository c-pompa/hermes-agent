# CI for cpompa/hermes-agent personal fork on gitlab.cpompa.com.
#
# Upstream NousResearch CI runs on GitHub Actions; this pipeline:
#   1. validates the personal customizations under skills/**/comfyui/
#      (validate-comfyui-skill, the original job), and
#   2. mirrors the highest-value upstream GitHub Actions lanes
#      (js-tests.yml, lint.yml, tests.yml smoke slice, uv-lockfile-check.yml)
#      so fork changes get real signal without upstream's full matrix.
#
# Runner: homelab-pc-shell (project_type, run_untagged=true, macOS arm64
# shell executor) — see memory project_homelab_gitlab.md for topology.
# `image:` is ignored by the shell executor; node/npm/uv live on the host
# PATH (~/.local/bin). The alpine image below only matters if a docker
# executor ever picks these jobs up.
#
# Skipped upstream lanes (deliberately): rust (no cargo on runner), Windows
# installer tests, docker/nix builds, GitHub-API-specific jobs.

default:
  image: python:3.11-alpine

stages:
  - validate
  - test

# ── Shared rule/change anchors ──────────────────────────────────────────────
# Fail-open fallback: manual/web pipelines and pushes to the default branch
# always run every job (mirrors upstream's fail-open detect job). Otherwise
# jobs gate on rules:changes globs.
.rule-web: &rule-web
  if: $CI_PIPELINE_SOURCE == "web"
.rule-default-branch: &rule-default-branch
  if: $CI_PIPELINE_SOURCE == "push" && $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH

.js-changes: &js-changes
  - apps/**/*
  - web/**/*
  - ui-tui/**/*
  - package.json
  - package-lock.json
  - .gitlab-ci.yml   # CI-definition changes re-validate the lanes they define

.py-changes: &py-changes
  - "**/*.py"
  - pyproject.toml
  - uv.lock
  - .gitlab-ci.yml   # CI-definition changes re-validate the lanes they define

# npm workspaces are hoisted from the root; cache the installed trees keyed
# on the lockfile and skip `npm ci` on a hit (npm ci wipes node_modules, so
# running it unconditionally would defeat the cache).
.node-modules-cache: &node-modules-cache
  key:
    files:
      - package-lock.json
  paths:
    - node_modules/
    - apps/desktop/node_modules/
    - apps/shared/node_modules/
    - web/node_modules/
    - ui-tui/node_modules/
    - ui-tui/packages/*/node_modules/
    - tests-js/node_modules/

.npm-ci: &npm-ci
  - node --version && npm --version
  - if [ ! -d node_modules ] || [ ! -d apps/desktop/node_modules ] || [ ! -d web/node_modules ]; then npm ci; fi

# uv's own cache (~/.cache/uv) persists on this shell runner, so `uv sync`
# is cheap; the .venv cache just avoids re-linking on lockfile-identical runs.
#
# The extras beyond all/dev are the lazy-install features (tools/lazy_deps.py)
# that tests exercise for real. tests/conftest.py sets
# HERMES_DISABLE_LAZY_INSTALLS=1, so those SDKs must be in the venv up front
# (mirrors upstream .github/workflows/tests.yml).
.uv-sync: &uv-sync
  - uv --version
  - uv sync --locked --python 3.11 --extra all --extra dev --extra anthropic --extra mistral --extra fal --extra modal --extra daytona --extra hindsight --extra parallel-web

.venv-cache: &venv-cache
  key:
    files:
      - uv.lock
  paths:
    - .venv/

# ── Original job (unchanged) ────────────────────────────────────────────────
validate-comfyui-skill:
  stage: validate
  # Portable across runner types: jq/python3 are host-installed on the macOS
  # shell runner (homebrew); apk only exists in the alpine docker image.
  before_script:
    - command -v jq >/dev/null 2>&1 || apk add --no-cache jq
  script:
    - echo "--- workflow JSON syntax ---"
    - for f in skills/mlops/models/comfyui/workflows/*.json; do echo "  $f"; jq empty "$f"; done
    - for f in skills/creative/comfyui/workflows/*.json; do echo "  $f"; jq empty "$f"; done
    - echo "--- python script compile ---"
    - python3 -m py_compile skills/mlops/models/comfyui/scripts/queue_workflow.py
    - python3 -m py_compile skills/creative/comfyui/scripts/*.py
    - echo "--- shell script syntax ---"
    - sh -n skills/mlops/models/comfyui/scripts/upload_model.sh
    - echo "all checks passed"
  rules:
    # Relevant-paths gated like every other job: only comfyui skill content
    # (plus the fail-open web / default-branch anchors above it).
    - *rule-web
    - *rule-default-branch
    - if: $CI_PIPELINE_SOURCE == "push" || $CI_PIPELINE_SOURCE == "merge_request_event"
      changes:
        - skills/**/comfyui/**/*

# ── P1: JS/TS checks (mirrors upstream js-tests.yml) ───────────────────────
js:lint-desktop:
  stage: test
  cache: *node-modules-cache
  before_script: *npm-ci
  script:
    - npm run --prefix apps/desktop check:lint
  rules:
    - *rule-web
    - *rule-default-branch
    - if: $CI_PIPELINE_SOURCE == "push" || $CI_PIPELINE_SOURCE == "merge_request_event"
      changes: *js-changes

js:test-plugins-desktop:
  stage: test
  cache: *node-modules-cache
  before_script: *npm-ci
  # node --test over the plugin SDK tests — highest-value lane: the fork's
  # headline feature is the desktop plugin system.
  script:
    - npm run --prefix apps/desktop check:test:plugins
  rules:
    - *rule-web
    - *rule-default-branch
    - if: $CI_PIPELINE_SOURCE == "push" || $CI_PIPELINE_SOURCE == "merge_request_event"
      changes: *js-changes

js:test-desktop:
  stage: test
  cache: *node-modules-cache
  before_script: *npm-ci
  # vitest unit suite for the desktop app.
  script:
    - npm run --prefix apps/desktop test
  rules:
    - *rule-web
    - *rule-default-branch
    - if: $CI_PIPELINE_SOURCE == "push" || $CI_PIPELINE_SOURCE == "merge_request_event"
      changes: *js-changes

js:check-shared:
  stage: test
  cache: *node-modules-cache
  before_script: *npm-ci
  script:
    - npm run --prefix apps/shared check
  rules:
    - *rule-web
    - *rule-default-branch
    - if: $CI_PIPELINE_SOURCE == "push" || $CI_PIPELINE_SOURCE == "merge_request_event"
      changes: *js-changes

js:check-web:
  stage: test
  cache: *node-modules-cache
  before_script: *npm-ci
  script:
    - npm run --prefix web check
  rules:
    - *rule-web
    - *rule-default-branch
    - if: $CI_PIPELINE_SOURCE == "push" || $CI_PIPELINE_SOURCE == "merge_request_event"
      changes: *js-changes

# ── P2: python lint + smoke tests (mirrors upstream lint.yml + tests.yml) ──
python:lint:
  stage: test
  # Blocking ruff check — enforces [tool.ruff.lint.select] in pyproject.toml.
  script:
    - uv tool install ruff
    - ruff check .
  rules:
    - *rule-web
    - *rule-default-branch
    - if: $CI_PIPELINE_SOURCE == "push" || $CI_PIPELINE_SOURCE == "merge_request_event"
      changes: *py-changes

python:smoke-tests:
  stage: test
  cache: *venv-cache
  before_script: *uv-sync
  # Fast slice of the python suite covering the fork's most-touched areas.
  # (pyproject addopts already excludes `integration` tests.)
  # scripts/run_tests.sh runs each file in its own pytest subprocess, like
  # upstream CI; several tests (e.g. A2A agent-card skills) read process-global
  # registries and fail when run in one process after other files.
  # Deselected: Linux-only behaviour upstream never runs on macOS (its macOS
  # lane is `-m macos_only`). Abstract AF_UNIX sockets do not exist on macOS,
  # AF_UNIX paths under macOS $TMPDIR exceed the 104-byte limit, and
  # shutdown_forensics shells out to GNU `timeout`.
  script:
    - >-
      scripts/run_tests.sh tests/plugins tests/gateway -j 4
      --deselect=tests/gateway/test_systemd_notify.py::test_notify_supports_systemd_abstract_socket
      --deselect=tests/gateway/test_scale_to_zero.py::test_suspend_self_posts_suspend_for_this_machine
      --deselect=tests/gateway/test_scale_to_zero.py::test_suspend_self_non_2xx_is_false_not_raise
      --deselect=tests/gateway/test_shutdown_forensics.py::TestSpawnAsyncDiagnostic::test_spawns_subprocess_and_writes_output
  rules:
    - *rule-web
    - *rule-default-branch
    - if: $CI_PIPELINE_SOURCE == "push" || $CI_PIPELINE_SOURCE == "merge_request_event"
      changes: *py-changes

python:macos-marker:
  stage: test
  cache: *venv-cache
  before_script: *uv-sync
  # macOS-specific tests; the runner is a macOS arm64 host so these actually
  # exercise their target platform (upstream mostly runs them on linux).
  script:
    - uv run python -m pytest -m "macos_only and not integration" -q
  rules:
    - *rule-web
    - *rule-default-branch
    - if: $CI_PIPELINE_SOURCE == "push" || $CI_PIPELINE_SOURCE == "merge_request_event"
      changes: *py-changes

# ── P3: uv lockfile check (mirrors upstream uv-lockfile-check.yml) ─────────
uv:lock-check:
  stage: test
  # Blocking: catches pyproject.toml / uv.lock drift before the docker build
  # (`uv sync --frozen`) does.
  script:
    - uv lock --check
  rules:
    - *rule-web
    - *rule-default-branch
    - if: $CI_PIPELINE_SOURCE == "push" || $CI_PIPELINE_SOURCE == "merge_request_event"
      changes:
        - pyproject.toml
        - uv.lock
